<head>

<script src="../js/anti-flash.js"></script>

<meta name="theme-color" content="#0a0d14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<div class="app">

    <header class="topbar">
      <div>
        <div class="topbar-title">Objectifs</div>
        <div class="topbar-sub">Progression long terme</div>
      </div>
      <div class="topbar-actions">
        <button class="menu-toggle">&#9776;</button>
        <button class="btn btn-primary btn-action-topbar" id="btn-new">+ Nouvel objectif</button>

    </header>
    <main class="content">
      <div class="card" style="margin-bottom:20px">
        <div class="card-header">
          <div>
            <div class="card-title">Objectif financier principal</div>
            <div class="card-sub">Objectif personnel - aucune garantie de resultat</div>
          </div>
          <button class="btn btn-sm" id="btn-edit-principal">Modifier</button>
        </div>
        <div id="objectif-principal"></div>
      </div>

      <div class="grid-2" id="liste"></div>

  </div>
