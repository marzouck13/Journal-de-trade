<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analyse des setups - Trade Journal</title>
<script src="../js/anti-flash.js"></script>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0a0d14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trade Journal">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="icon" href="../assets/favicon.png" sizes="any">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div>
        <div class="topbar-title">Analyse des setups</div>
        <div class="topbar-sub">Ce qui fonctionne reellement</div>
      </div>
      <div class="topbar-actions">
        <button class="menu-toggle">&#9776;</button>
        <button class="btn btn-primary btn-action-topbar" id="btn-new">+ Nouveau setup</button>
      </div>
    </header>
    <main class="content">
      <div class="grid-2" style="margin-bottom:20px">
        <div class="card">
          <div class="card-header"><div class="card-title">P&L par setup</div></div>
          <div class="chart-box"><canvas id="c-pnl"></canvas></div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-title">Winrate par setup</div></div>
          <div class="chart-box"><canvas id="c-wr"></canvas></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Tableau des setups</div>
          <div class="card-sub" id="liste"></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Setup</th><th class="num">Trades</th><th class="num">Winrate</th>
                <th class="num">P&L</th><th class="num">R total</th><th class="num">R moyen</th>
                <th class="num">Expectancy</th><th class="num">PF</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../js/vendor/chart.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/utilitaires.js"></script>
<script src="../js/stockage.js"></script>
<script src="../js/stockage-images.js"></script>
<script src="../js/donnees.js"></script>
<script src="../js/calculs.js"></script>
<script src="../js/graphiques.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/pages/setups.js"></script>
<script src="../js/app.js"></script>
<script src="../js/pwa-register.js"></script>
<script src="../js/pwa-install.js"></script>
</body>
</html>
