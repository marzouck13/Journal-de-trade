<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolution - Trade Journal</title>
<script src="../js/anti-flash.js"></script>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0a0d14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trade Journal">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="icon" href="../assets/favicon.png" sizes="any">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div>
        <div class="topbar-title">Evolution du capital</div>
        <div class="topbar-sub" id="topbar-sub"></div>
      </div>
      <div class="topbar-actions"><button class="menu-toggle">&#9776;</button></div>
    </header>
    <main class="content">
      <div class="kpi-grid" id="kpis"></div>
      <div class="card" style="margin-top:16px">
        <div class="card-header"><div class="card-title">Evolution du capital</div></div>
        <div class="chart-box tall"><canvas id="c-capital"></canvas></div>
      </div>
      <div class="card" style="margin-top:16px">
        <div class="card-header"><div class="card-title">P&L cumule</div></div>
        <div class="chart-box tall"><canvas id="c-pnl"></canvas></div>
      </div>
      <div class="card" style="margin-top:16px">
        <div class="card-header"><div class="card-title">Drawdown dans le temps</div></div>
        <div class="chart-box tall"><canvas id="c-dd"></canvas></div>
      </div>
    </main>
  </div>
</div>

<script src="../js/vendor/chart.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/utilitaires.js"></script>
<script src="../js/stockage.js"></script>

<script src="../js/graphiques.js"></script>

<script src="../js/app.js"></script>
<script src="../js/pwa-register.js"></script>
<script src="../js/pwa-install.js"></script>
</body>
</html>
