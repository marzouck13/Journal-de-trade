<body>

<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div>
        <div class="topbar-title">Psychologie</div>
        <div class="topbar-sub">Etat mental et resultats</div>
      </div>
      <div class="topbar-actions"><button class="menu-toggle">&#9776;</button></div>
    </header>
    <main class="content">
      <div class="info-banner" style="margin-bottom:20px">
        Ces correlations sont historiques et personnelles. Elles ne prouvent pas de causalite.
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Resultat total par etat mental</div></div>
        <div class="chart-box"><canvas id="c-mental"></canvas></div>
      </div>
      <div class="card" style="margin-top:16px">
        <div class="card-header"><div class="card-title">Detail</div></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Etat mental</th><th class="num">Trades</th><th class="num">R total</th><th class="num">P&L</th><th class="num">Winrate</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
