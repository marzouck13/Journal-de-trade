<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal - Trade Journal</title>
<script src="../js/anti-flash.js"></script>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0a0d14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trade Journal">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="icon" href="../assets/favicon.png" sizes="any">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div>
        <div class="topbar-title">Journal des trades</div>
        <div class="topbar-sub" id="topbar-sub">Historique complet</div>
      </div>
      <div class="topbar-actions">
        <button class="menu-toggle">&#9776;</button>
        <a href="nouveau-trade.html" class="btn btn-primary btn-action-topbar">+ Nouveau trade</a>
      </div>
    </header>
    <main class="content">

      <div class="card" style="margin-bottom:16px">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Recherche</label>
            <input type="text" class="input" id="f-recherche" placeholder="Commentaire, setup, actif...">
          </div>
          <div class="form-group">
            <label class="form-label">Actif</label>
            <select class="select" id="f-actif"><option value="">Tous</option></select>
          </div>
          <div class="form-group">
            <label class="form-label">Direction</label>
            <select class="select" id="f-direction"><option value="">Toutes</option><option>BUY</option><option>SELL</option></select>
          </div>
          <div class="form-group">
            <label class="form-label">Setup</label>
            <select class="select" id="f-setup"><option value="">Tous</option></select>
          </div>
          <div class="form-group">
            <label class="form-label">Resultat</label>
            <select class="select" id="f-resultat">
              <option value="">Tous</option>
              <option value="WIN">WIN</option>
              <option value="LOSS">LOSS</option>
              <option value="BE">BE</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Respect du plan</label>
            <select class="select" id="f-plan"><option value="">Tous</option><option value="oui">Oui</option><option value="non">Non</option></select>
          </div>
          <div class="form-group">
            <label class="form-label">Du</label>
            <input type="date" class="input" id="f-date-deb">
          </div>
          <div class="form-group">
            <label class="form-label">Au</label>
            <input type="date" class="input" id="f-date-fin">
          </div>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="btn btn-sm" id="btn-reset">Reinitialiser</button>
          <div class="spacer"></div>
          <span class="text-sm muted" id="compteur"></span>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-tri="date">Date</th>
              <th data-tri="actif">Actif</th>
              <th data-tri="direction">Direction</th>
              <th data-tri="setup">Setup</th>
              <th class="num">Risque</th>
              <th class="num" data-tri="resultat">Resultat $</th>
              <th class="num" data-tri="resultatR">R</th>
              <th>Statut</th>
              <th>Plan</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<script src="../js/vendor/chart.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/utilitaires.js"></script>
<script src="../js/stockage.js"></script>
<script src="../js/stockage-images.js"></script>
<script src="../js/donnees.js"></script>
<script src="../js/calculs.js"></script>
<script src="../js/graphiques.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/pages/journal.js"></script>
<script src="../js/app.js"></script>
<script src="../js/pwa-register.js"></script>
<script src="../js/pwa-install.js"></script>
</body>
</html>
