<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div>
        <div class="topbar-title">Dashboard</div>
        <div class="topbar-sub" id="topbar-sub">Vue d'ensemble</div>
      </div>
      <div class="topbar-actions">
        <button class="menu-toggle" aria-label="Menu">&#9776;</button>
        <a href="pages/nouveau-trade.html" class="btn btn-primary btn-action-topbar" title="Nouveau trade" aria-label="Nouveau trade">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Nouveau trade
        </a>
      </div>
    </header>
    <main class="content">

      <div id="alerte-capital" class="hidden"></div>
      <div class="kpi-grid" id="kpi-principal"></div>

      <div class="section-title" style="margin-top:24px">Mon univers</div>
      <div class="grid-4" id="mon-univers" style="margin-bottom:24px"></div>

      <div class="grid-2" style="margin-bottom:16px">
        <div class="card">
          <div class="card-header"><div><div class="card-title">Evolution du capital</div></div></div>
          <div class="chart-box"><canvas id="chart-capital"></canvas></div>
        </div>
        <div class="card">
          <div class="card-header"><div><div class="card-title">P&L cumule</div></div></div>
          <div class="chart-box"><canvas id="chart-pnl"></canvas></div>
        </div>
      </div>

      <div class="grid-2" style="margin-bottom:16px">
        <div class="card">
          <div class="card-header"><div><div class="card-title">Drawdown</div></div></div>
          <div class="chart-box"><canvas id="chart-dd"></canvas></div>
        </div>
        <div class="card">
          <div class="card-header"><div><div class="card-title">Distribution en R</div></div></div>
          <div class="chart-box"><canvas id="chart-distr"></canvas></div>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-header"><div><div class="card-title">Performance par actif</div></div></div>
          <div class="chart-box"><canvas id="chart-actifs"></canvas></div>
        </div>
        <div class="card">
          <div class="card-header"><div><div class="card-title">Performance mensuelle</div></div></div>
          <div class="chart-box"><canvas id="chart-mois"></canvas></div>
        </div>
      </div>

    </main>
  </div>
</div>
